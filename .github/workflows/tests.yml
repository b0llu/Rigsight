# Unit and UI tests on every push and pull request (free for public repositories). The performance budgets and the
# end-to-end run need a quiet PC with a desktop, so they run locally before each release: tools\test.ps1.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The tests' data folders (and the pages' screenshots) go under the temp folder: keep it where it can be uploaded.
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A time zone with clock changes, so the daylight-saving tests run (the runner's UTC has none).
      - name: Time zone
        run: tzutil /s "Pacific Standard Time"

      - name: Build
        run: dotnet build Rigsight.slnx -c Debug -nologo

      - name: Test
        run: dotnet test --project tests/Rigsight.Tests --no-build --filter-not-trait "Category=Perf" --results-directory TestResults --report-xunit-trx

      - name: Keep results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            ${{ runner.temp }}/rigsight-tests/**/screens
          if-no-files-found: ignore
